name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # package-lock.json появится после первого npm install у разработчиков, тогда здесь можно перейти на npm ci
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Проверка типов
        run: npm run typecheck

      - name: Форматирование
        run: npm run format:check

      - name: Модульные тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Браузер для сквозных тестов
        run: npx playwright install --with-deps chromium

      - name: Сквозные тесты
        run: npm run test:e2e

      - name: Отчет Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
